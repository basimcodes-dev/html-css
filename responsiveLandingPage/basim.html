<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .feature-card {
      width: 320px;
      height: 420px;
      border-radius: 20px;
      border: 2px solid orange;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    /* IMAGE AREA */
    .img-box {
      height: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      position: relative;
    }

    .img-box img {
      width: 80%;
    }

    /* ORANGE BACKGROUND */
    .orange-box {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background: #ffb703;
    }

    /* GREEN OFFER BOX */
    .offer-box {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #7ac70c;
      padding: 30px 30px;
      border-radius: 12px;
      text-align: center;
      z-index: 2;
      width: 60%;

    }

    .offer-box h3 {
      margin: 0;
      color: white;
    }

    .offer-box p {
      margin: 5px 0 0;
      font-size: 24px;
      font-weight: bold;
      color: #2f4f2f;
    }

    /* .main-feature{
  display: flex;
  gap: 30px;
} */

    /* CARD */
    .feature-card1 {
      width: 300px;
      padding: 30px;
      background: #f6f7f8;
      border-radius: 20px;

      /* IMPORTANT */
      position: relative;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    /* IMAGE */
    .img-box {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TEXT */
    .content h3 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .stars {
      color: #7fb401;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* BUTTON */
    .cart-btn {
      padding: 10px 36px;
      border-radius: 30px;
      background: transparent;
      border: 1px solid orange;
      color: #7fb401;
      font-size: 16px;
      cursor: pointer;

    }

    .stars {
      font-size: 20px;
      color: #7fb401;
      background-color: #f6f7f8;
    }

    .stars .last-star {
      color: #45595B;
    }

    .features-section1 {
      background: #f2f4f5;
      /* grey ish background */
      padding: 60px;
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    .feature-card {
      background: #ffffff;
      width: 260px;
      padding: 40px 20px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .feature-card .icon {
      font-size: 50px;
      color: orange;
      margin-bottom: 20px;
    }

    .feature-card h3 {
      color: #7cc000;
      /* green text */
      font-size: 18px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .feature-card p {
      font-size: 42px;
      font-weight: 700;
      color: #45595B;

    }

    .stats-section1 {
      background: #f6f7f8;
      padding: 30px 0;
      border-radius: 20px;
      width: 90%;
      display: flex;
      margin: 0 auto;
      align-items: center;
    }

    .stats-wrapper {
      max-width: 1000px;
      margin: auto;
      display: flex;
      gap: 30px;
      justify-content: center;
      overflow: hidden;

    }

    .stat-card {
      background: #fff;
      width: 260px;
      padding: 50px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
    }

    .stat-icon {
      margin-bottom: 30px;
    }

    .stat-icon img {
      width: 60px;
    }

    .stat-card h1 {
      font-size: 20px;
      line-height: 1.4;
      letter-spacing: 1px;
      color: #7fc400;
      font-weight: 500;
      margin-bottom: 30px;
    }

    .stat-card h1 {
      font-size: 48px;
      font-weight: 700;
      color: #45595B;
    }

    .stat-icon i {
      font-size: 60px;
      color: #FDB515;
    }

    .subscribe-box {
      width: 600px;
      margin: 50px auto;
      /* background: #506666;  */
      padding: 20px;
      border-radius: 50px;
      display: flex;
    }

    .subscribe-box input {
      flex: 1;
      padding: 18px 25px;
      border: none;
      outline: none;
      border-radius: 50px 0 0 50px;
      font-size: 18px;
    }

    .subscribe-box button {
      padding: 18px 35px;
      border: none;
      border-radius: 0 50px 50px 0;
      background: #7BC000;
      /* green color */
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .subscribe-box button:hover {
      background: #ffb703;
    }
  </style>
</head>

<body>
  <div class="feature-card">

    <div class="img-box">
      <img src="/responsiveLandingPage/img/featur-1.jpg" alt="Fresh Apples">
    </div>

    <div class="orange-box"></div>

    <div class="offer-box">
      <h3>Fresh Apples</h3>
      <p>20% OFF</p>
    </div>

  </div>
  <section class="stats-section1">
    <div class="stats-wrapper">

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fa-solid fa-users"></i>

        </div>
        <h4>SATISFIED<br>CUSTOMERS</h4>
        <span>1963</span>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fa-solid fa-users"></i>

        </div>
        <h4>QUALITY OF<br>SERVICE</h4>
        <span>99%</span>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fa-solid fa-users"></i>

        </div>
        <h4>QUALITY<br>CERTIFICATES</h4>
        <span>33</span>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fa-solid fa-users"></i>

        </div>
        <h4>AVAILABLE<br>PRODUCTS</h4>
        <span>789</span>
      </div>

    </div>
  </section>
  <div class="subscribe-box">
    <input type="email" placeholder="Your Email">
    <button>Subscribe Now</button>
  </div>
  
</body>

</html>
